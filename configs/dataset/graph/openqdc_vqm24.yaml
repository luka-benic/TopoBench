# OpenQDC VQM24 (generated by scripts/openqdc/generate_configs.py;
# regenerate instead of editing by hand).
# 1,104,982 molecules, up to 17 atoms, 1 energy column(s).
# Large dataset: set dataset.loader.parameters.max_samples for quick runs.
# Energy columns (1): set loader.parameters.energy_method to the index
# of the column to train on.
#   0: wB97x-D3/cc-pVDZ

# Dataset loader config
loader:
  _target_: topobench.data.loaders.graph.OpenQDCDatasetLoader
  parameters:
    data_domain: graph
    data_type: openqdc
    data_name: VQM24
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}
    openqdc_cache_dir: ${oc.env:OPENQDC_CACHE_DIR,${paths.data_dir}/openqdc}
    atom_types: [1, 6, 7, 8, 9, 14, 15, 16, 17, 35]
    target: formation_energies # formation_energies | energies | per_atom_formation_energies
    # Energy column to train on: its index in the list at the top of this file.
    # Command line: dataset.loader.parameters.energy_method=<index> or --energy-method <index or name> in the scripts.
    energy_method: 0
    baseline: per_element # per_element subtracts fitted per-element energies from y
    edge_method: bonds # bonds (covalent radii) | radius
    bond_scale: 1.3
    cutoff: 5.0 # Angstrom, used when edge_method=radius
    max_samples: null
    subsample_seed: 0

# Dataset parameters
parameters:
  num_features:
    - 11 # one-hot over atom_types + formal atomic charge
  num_classes: 1
  task: regression
  loss_type: mse
  monitor_metric: mae
  task_level: graph
  max_dim_if_lifted: 3
  preserve_edge_attr_if_lifted: False

# splits
split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}_m${dataset.loader.parameters.energy_method}_n${dataset.loader.parameters.max_samples}_s${dataset.loader.parameters.subsample_seed}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.8

# Dataloader parameters
dataloader_params:
  batch_size: 128
  num_workers: 0
  pin_memory: False
