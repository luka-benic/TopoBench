# OpenQDC QM9 (generated by scripts/openqdc/generate_configs.py;
# regenerate instead of editing by hand).
# 133,885 molecules, up to 29 atoms, 9 energy column(s).
# OpenQDC labels the energies 'hartree' but they are kcal/mol; the loader corrects this.
# energy_method (column) -> QM method:
#   0: Internal energy at 0 K
#   1: B3LYP:def2-svp
#   2: HF:cc-pvtz
#   3: HF:sto-3g
#   4: PBE:sto-3g
#   5: SVWN:sto-3g
#   6: WB97X-D:aug-cc-pvtz
#   7: WB97X-D:def2-svp
#   8: WB97X-D:def2-tzvp

# Dataset loader config
loader:
  _target_: topobench.data.loaders.graph.OpenQDCDatasetLoader
  parameters:
    data_domain: graph
    data_type: openqdc
    data_name: QM9
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}
    openqdc_cache_dir: ${oc.env:OPENQDC_CACHE_DIR,${paths.data_dir}/openqdc}
    atom_types: [1, 6, 7, 8, 9]
    target: formation_energies # formation_energies | energies | per_atom_formation_energies
    energy_method: 0
    energy_unit: ev
    stored_energy_unit: kcal/mol # true unit of the stored numbers
    stored_distance_unit: bohr
    baseline: per_element # per_element subtracts fitted per-element energies from y
    edge_method: bonds # bonds (covalent radii) | radius
    bond_scale: 1.3
    cutoff: 5.0 # Angstrom, used when edge_method=radius
    max_samples: null
    subsample_seed: 0

# Dataset parameters
parameters:
  num_features:
    - 6 # one-hot over atom_types + formal atomic charge
  num_classes: 1
  task: regression
  loss_type: mse
  monitor_metric: mae
  task_level: graph
  max_dim_if_lifted: 3
  preserve_edge_attr_if_lifted: False

# splits
split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}_m${dataset.loader.parameters.energy_method}_n${dataset.loader.parameters.max_samples}_s${dataset.loader.parameters.subsample_seed}
  data_seed: 0
  split_type: random
  k: 10
  train_prop: 0.8

# Dataloader parameters
dataloader_params:
  batch_size: 128
  num_workers: 0
  pin_memory: False
